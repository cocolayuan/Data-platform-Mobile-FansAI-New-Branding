<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src data: blob:; frame-src 'self' about: data:; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FansAI Branding Data</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9eff1}body{display:grid;place-items:center;min-height:100dvh;padding:24px}.phone{width:440px;height:min(956px,calc(100dvh - 48px));min-height:560px;border-radius:32px;overflow:hidden;background:#eef4f3;box-shadow:0 24px 80px -24px #34536540,0 0 0 1px #fff}iframe{border:0;display:block;width:100%;height:100%;background:#eef4f3}@media(max-width:680px){body{display:block;padding:0}.phone{width:100%;height:100dvh;min-height:0;border-radius:0;box-shadow:none}}</style>
</head><body><main class="phone"><iframe id="app" src="./app.html" title="FansAI Branding Data" allow="clipboard-write"></iframe></main>

<script>
const tab=new URLSearchParams(location.search).get('tab');
const route={growth:'t-ops',customer:'t-cust',decisions:'t-appr',workbench:'t-more'}[tab];
if(route)document.querySelector('#app').addEventListener('load',function(){
  const doc=this.contentDocument;
  const select=()=>{const target=doc.getElementById(route);if(!target)return false;target.click();return true};
  if(select())return;
  const watch=new MutationObserver(()=>{if(select())watch.disconnect()});
  watch.observe(doc.body,{childList:true,subtree:true});
},{once:true});
</script></body></html>
